name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compilar
        run: gradle assembleRelease --stacktrace
      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk LousaGravada.apk
      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Lousa Gravada v${{ github.run_number }}
          body: "Baixe o arquivo LousaGravada.apk abaixo e instale no tablet."
          files: LousaGravada.apk
          make_latest: true
